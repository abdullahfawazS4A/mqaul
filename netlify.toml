[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: أي مسار غير موجود يرجع index.html عشان react-router يشتغل
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# الـService Worker يجب ألّا يُخزَّن، وإلا بقي المستخدمون على نسخة قديمة
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
